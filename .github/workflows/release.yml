name: release
# Tag vX.Y.Z -> build amd64, sign, and publish to the rolling channel release (stable-amd64) that nodes follow.
on:
  push:
    tags: ["v*"]
  # Build and sign a test version without touching the stable channel; the release directory is attached to the run as an artifact.
  workflow_dispatch:
    inputs:
      version:
        description: "version to build (for example 0.2.2-rc1); never published"
        required: true
      profile:
        description: "mkosi profile (debug: serial autologin for VM tests; the disk image is attached to the run). Empty: the release build."
        required: false
        default: ""

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          # arm64 is not built: no node uses it and the image has never been booted on arm64. Add
          # `- runner: ubuntu-24.04-arm` / `arch: arm64` back once an arm64 node exists.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      EDGE_REL_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: signing key
        env:
          KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          PASS: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          test -s signing/edge-node-image.pub.gpg || { echo "signing/edge-node-image.pub.gpg is missing; see signing/README.md"; exit 1; }
          echo "$KEY" | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "RELEASE_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: build
        run: |
          EDGE_VERSION="${EDGE_REL_VERSION#v}" EDGE_ARCH=${{ matrix.arch }} EDGE_RELEASE=1 EDGE_PROFILE="${{ github.event_name == 'workflow_dispatch' && inputs.profile || '' }}" scripts/build-local.sh
      - name: package and sign
        env:
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: scripts/make-release.sh mkosi.output "${EDGE_REL_VERSION#v}" "release-${{ matrix.arch }}" "$RELEASE_KEY"
      - name: compress the disk image (debug-profile runs, for VM tests)
        if: github.event_name == 'workflow_dispatch' && inputs.profile != ''
        run: zstd -T0 -3 -f mkosi.output/edge-node.raw -o disk-${{ matrix.arch }}.raw.zst
      - name: attach the debug disk image
        if: github.event_name == 'workflow_dispatch' && inputs.profile != ''
        uses: actions/upload-artifact@v4
        with:
          name: disk-${{ matrix.arch }}-${{ inputs.profile }}
          path: disk-${{ matrix.arch }}.raw.zst
          retention-days: 3
          compression-level: 0
      - name: attach the release directory (build-only runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: release-${{ matrix.arch }}
          retention-days: 7
      - name: publish to the channel (candidate for -rc tags, stable otherwise)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a tag like v0.3.0-rc1 goes to candidate-<arch>, which only the canary follows (nodectl channel); promote.yml copies
          # it to stable-<arch> after the soak
          case "${GITHUB_REF_NAME}" in *-rc*) tag="candidate-${{ matrix.arch }}";; *) tag="stable-${{ matrix.arch }}";; esac
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Rolling channel followed by nodes. Do not download by hand." --prerelease
          # replace the channel contents: nodes read SHA256SUMS in this directory. Upload first (SHA256SUMS last, so
          # it only ever lists files that exist), then drop assets that are no longer part of the release.
          cd release-${{ matrix.arch }}
          gh release upload "$tag" --clobber $(ls | grep -v '^SHA256SUMS') SHA256SUMS SHA256SUMS.gpg
          for a in $(gh release view "$tag" --json assets --jq '.assets[].name'); do [ -e "$a" ] || gh release delete-asset "$tag" "$a" --yes; done
