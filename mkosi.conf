# UNTESTED scaffold. See docs/testing.md.
[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
ImageId=edge-node
Output=edge-node
OutputDirectory=mkosi.output

[Content]
Bootable=yes
Bootloader=systemd-boot
# net.ifnames=0 biosdevname=0: eth0, not ens3 (as on hades-02).
KernelCommandLine=ro net.ifnames=0 biosdevname=0
# Locked root, no SSH, no cloud-init: access is through noded.
RootPassword=hashed:!
Hostname=edge-node
Packages=
        systemd-sysv
        systemd-boot
        systemd-resolved
        systemd-timesyncd
        systemd-zram-generator
        systemd-oomd
        polkitd
        udev
        kmod
        iproute2
        iptables
        nftables
        ipset
        conntrack
        ca-certificates
        curl
        e2fsprogs
        dosfstools
