[Config]
# build mkosi.images/initrd first and use it as the initrd (adds reboot-on-failure to the emergency units)
Dependencies=initrd

# UNTESTED scaffold. See docs/testing.md.
[Build]
# cache the installed base between builds (invalidated automatically when packages/config change)
Incremental=yes

[Distribution]
Distribution=debian
Release=trixie

[Output]
SplitArtifacts=uki,partitions
Format=disk
ImageId=edge-node
Output=edge-node
OutputDirectory=mkosi.output
# repart otherwise formats the ESP FAT with 4096-byte sectors on a 512-byte GPT, which edk2 cannot mount.
SectorSize=512

# dm-verity comes from the Verity= partitions in mkosi.repart/: the kernel command line carries the root hash, which also
# selects the A/B slot. Unsigned (mkosi 25.3 treats Verity=yes as signed and wants a key).
[Content]
Bootable=yes
# the initrd built from mkosi.images/initrd (the standard one plus reboot-on-failure for the emergency units)
Initrds=%O/initrd.cpio.zst
# sysupdate needs <image id>_<version>.efi; boot counting (+N) is appended because /etc/kernel/tries exists.
UnifiedKernelImageFormat=%i_%v
UnifiedKernelImages=yes
Bootloader=systemd-boot
# net.ifnames=0 biosdevname=0: eth0, not ens3 (as on hades-02).
# slab_nomerge init_on_alloc=1 pti=on: heap hardening (init_on_alloc costs a little CPU). module.sig_enforce=1: only the distribution-signed
# modules load. lockdown=integrity: no /dev/mem write, kexec of unsigned images or raw kernel memory access, even as root.
# proc_mem.force_override=never: no writes to another process's memory through /proc/<pid>/mem (kernel 6.12+).
KernelCommandLine=ro net.ifnames=0 biosdevname=0 transparent_hugepage=never audit=0 slab_nomerge init_on_alloc=1 pti=on module.sig_enforce=1 lockdown=integrity proc_mem.force_override=never
# Locked root, no SSH, no cloud-init: access is through noded.
RootPassword=hashed:!
Hostname=edge-node
# not needed on a headless node (the image is read-only: no one reads these)
RemoveFiles=/usr/share/locale
        /usr/share/doc
        /usr/share/man
        /usr/share/info
        /usr/share/lintian
        /usr/share/bug
Packages=
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-timesyncd
        systemd-zram-generator
        systemd-oomd
        udev
        kmod
        iproute2
        iptables
        nftables
        ipset
        conntrack
        ca-certificates
        curl
        e2fsprogs
        dosfstools
        util-linux
        systemd-boot-tools
        systemd-repart
        systemd-container
        gpgv
        gpg
        xz-utils
        zstd
        jq
