# Starting points for 954 MB, swapless-until-zram nodes. NOT measured yet; tune on the trial node.
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
vm.min_free_kbytes = 16384
# hades-02 needed 512 for promtail ("too many open files"); the edge nodes are still at the default 128.
fs.inotify.max_user_instances = 512

# Phase A hardening. dmesg_restrict and unprivileged_bpf_disabled were already on in the Debian defaults; stated here so they cannot
# silently regress.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.kexec_load_disabled = 1
kernel.yama.ptrace_scope = 1
kernel.unprivileged_bpf_disabled = 2
net.core.bpf_jit_harden = 2
