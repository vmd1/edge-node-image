# State the read-only root cannot hold. /etc/rancher/node (the k3s node password) is a symlink into /var.
d /var/lib/edge 0755 root root -
d /var/lib/edge/rancher-node 0700 root root -
d /var/lib/rancher 0755 root root -
d /var/tmp 1777 root root -
# no raw memory or port access from userspace (verified by the KVM tests; STRICT_DEVMEM is the second line of defense)
r! /dev/mem
r! /dev/kmem
r! /dev/port
