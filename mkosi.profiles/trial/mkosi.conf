# TRIAL VARIANT (OCI): a root shell on the serial console (reachable only through the OCI console connection) and a self-check on
# boot. Unlike the debug profile it keeps the RELEASE noded (no allow-all, tailnet listener only) and all real health checks,
# because this image runs on a machine with a public IP.
[Content]
Packages=
        procps
        util-linux
        less
