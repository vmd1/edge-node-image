// noded: the node agent. Typed operations only; there is deliberately no exec or shell RPC.
// UNTESTED draft; see docs/testing.md.
syntax = "proto3";

package noded.v1;

option go_package = "github.com/vmd1/edge-node-image/gen/nodedv1";

service Noded {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Logs(LogsRequest) returns (stream LogLine);
  rpc CheckUpdate(CheckUpdateRequest) returns (CheckUpdateResponse);
  rpc StageUpdate(StageUpdateRequest) returns (StageUpdateResponse);
  rpc GetUpdateConfig(GetUpdateConfigRequest) returns (UpdateConfig);
  rpc SetUpdateConfig(UpdateConfig) returns (SetUpdateConfigResponse);
  rpc Reboot(RebootRequest) returns (RebootResponse);
  rpc SetBootSlot(SetBootSlotRequest) returns (SetBootSlotResponse);
  rpc GetRegistryConfig(GetRegistryConfigRequest) returns (RegistryConfig);
  rpc SetRegistryConfig(RegistryConfig) returns (SetRegistryConfigResponse);
  // Declarative node config (EdgeNodeConfig): the agent pulls the objects itself; these RPCs are the out-of-band path.
  rpc GetConfig(GetConfigRequest) returns (ConfigState);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc SetConfigOverride(SetConfigOverrideRequest) returns (SetConfigOverrideResponse);
  rpc ClearConfigOverride(ClearConfigOverrideRequest) returns (ClearConfigOverrideResponse);
  // Read-only introspection (Phase 2.C): typed resources, allowlisted files, bounded streams.
  rpc Inspect(InspectRequest) returns (InspectResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc Service(ServiceRequest) returns (ServiceResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Events(EventsRequest) returns (stream LogLine);
  rpc Support(SupportRequest) returns (stream Chunk);
  rpc Pcap(PcapRequest) returns (stream Chunk);
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // Wipe writable state and return the node to a first-boot state (the signed image and A/B slots are untouched).
  rpc ResetPreflight(ResetRequest) returns (ResetPreflightResponse);
  rpc Reset(ResetRequest) returns (ResetResponse);
}

message StatusRequest {}
message StatusResponse {
  string image_version = 1;
  string booted_entry = 2;         // boot entry file name, e.g. edge-node_1.0.0+2-1.efi
  string boot_assessment = 3;      // good / pending / bad
  string available_version = 4;    // newest version sysupdate can see, if any
  double mem_pressure_some_avg10 = 5;
  double io_pressure_some_avg10 = 6;
  uint64 mem_available_bytes = 7;
  map<string, string> units = 8;   // unit name -> active state, for an allowlist of units
  string external_ip = 9;
  uint64 uptime_seconds = 10;
  string boot_id = 11;             // changes on every boot; nodectl uses it to know a reboot happened
}

message LogsRequest {
  string unit = 1;                 // must be on the allowlist
  uint32 tail_lines = 2;
  bool follow = 3;
}
message LogLine { string text = 1; }

message CheckUpdateRequest {}
message CheckUpdateResponse { string current_version = 1; string newest_version = 2; string output = 3; }

message StageUpdateRequest { string target_version = 1; }   // empty = newest allowed
message StageUpdateResponse { string staged_version = 1; string output = 2; }

message GetUpdateConfigRequest {}
message UpdateConfig {
  // Base URL of the release directory (SHA256SUMS lives there). Empty = the image's baked default.
  string update_url = 1;
}
message SetUpdateConfigResponse {}

message RebootRequest {}
message RebootResponse {}

// version: an installed image version, e.g. "1.0.0"; the matching boot entry is edge-node_<version>.efi.
message SetBootSlotRequest { string version = 1; bool one_shot = 2; }
message SetBootSlotResponse {}

message GetRegistryConfigRequest {}
message RegistryConfig {
  // docker.io mirror, e.g. "https://mirror.gcr.io"; empty = pull from Docker Hub directly.
  string docker_io_mirror = 1;
  string docker_io_fallback = 2;
}
message SetRegistryConfigResponse { bool k3s_agent_restarted = 1; }

message GetConfigRequest {}
message ConfigState {
  string applied_json = 1;      // last-known-good effective spec ("" = nothing configured)
  string applied_hash = 2;
  string staged_json = 3;       // waiting for the next boot
  string override_json = 4;     // active nodectl override, if any (beats the CRD)
  string override_expires = 5;  // RFC 3339
  string rendered = 6;          // the generated files for the applied spec, as "path\n<content>" blocks
}
message ValidateConfigRequest { string spec_json = 1; }
message ValidateConfigResponse { bool valid = 1; string error = 2; string hash = 3; string rendered = 4; }
message SetConfigOverrideRequest { string spec_json = 1; uint32 ttl_seconds = 2; }   // 0 = default 4 h, max 7 d
message SetConfigOverrideResponse { string expires = 1; }
message ClearConfigOverrideRequest {}
message ClearConfigOverrideResponse {}

// kind: image, boot, memory, psi, mounts, sysctl, modules, processes, netstat, cgroups, services, tailscale, kubelet, time, config
message InspectRequest { string kind = 1; string arg = 2; uint32 limit = 3; }   // arg: sort for processes, preset for cgroups, unit for services
message InspectResponse { string json = 1; }
message ListFilesRequest { string path = 1; }
message ListFilesResponse { string json = 1; }
message ReadFileRequest { string path = 1; uint32 max_bytes = 2; }
message ReadFileResponse { bytes data = 1; }
message ServiceRequest { string action = 1; string unit = 2; }   // status | start | stop | restart (allowlisted units)
message ServiceResponse { string output = 1; }
message HealthRequest {}
message HealthResponse { bool ok = 1; string json = 2; }
message EventsRequest { uint32 tail_lines = 1; bool follow = 2; }
message SupportRequest {}
message Chunk { bytes data = 1; }
// A bounded capture: at most 120 s and 50 MB, one at a time. Filters are fields, not a BPF string.
message PcapRequest { string iface = 1; string host = 2; uint32 port = 3; string proto = 4; uint32 seconds = 5; uint32 max_bytes = 6; }
message WhoAmIRequest {}
message WhoAmIResponse { string device = 1; string user = 2; string role = 3; string mode = 4; }   // mode: audit | enforce

message ResetRequest {
  string wipe = 1;     // "k3s" (default: delete k3s/kubelet/containerd state, keep Tailscale identity and node password) or "all-var"
  bool reboot = 2;     // false: stop after the wipe, for inspection (k3s stays stopped; ignored for all-var, which always reboots)
}
message ResetPreflightResponse { bool ok = 1; string detail = 2; }   // all-var: can first boot re-provision from instance metadata?
message ResetResponse { repeated string removed = 1; bool rebooting = 2; }
